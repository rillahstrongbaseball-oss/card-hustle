<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop MLB Cards by Team | Card Deal Scout</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #06111a;
      color: #f5f7fa;
      font-family: Arial, sans-serif;
    }

    .wrap {
      width: min(1100px, 92%);
      margin: auto;
    }

    header {
      padding: 28px 0;
      border-bottom: 1px solid #193447;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .logo span {
      color: #32e68a;
    }

    .back {
      display: inline-block;
      margin-top: 15px;
      color: #32e68a;
      text-decoration: none;
      font-weight: bold;
    }

    h1 {
      font-size: 42px;
      margin: 45px 0 10px;
    }

    .intro {
      color: #9fb1c1;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .teams {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      padding-bottom: 60px;
    }

    .team {
      background: #0c1c27;
      border: 1px solid #1d3b4f;
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      min-height: 180px;
    }

    .team img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .team a {
      color: #32e68a;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <div class="wrap">
    <div class="logo">CARD<span>DEAL</span>SCOUT</div>
    <a class="back" href="index.html">← Back to Home</a>
  </div>
</header>

<main class="wrap">
  <h1>Shop MLB Cards by Team</h1>
  <p class="intro">
    Choose your favorite MLB team to scout cards, rookies, prospects,
    case hits, high-end cards, team breaks and auctions ending soon.
  </p>

  <div class="teams">

    <div class="team">
      <img src="stl-cardinals-logo.webp" alt="St. Louis Cardinals logo">
      <br>
      <a href="cardinals.html">St. Louis Cardinals →</a>
    </div>

  </div>
</main>

</body>
</html>
